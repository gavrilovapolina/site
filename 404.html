<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — страница не найдена | Полина Гаврилова</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sofia+Sans+Extra+Condensed:wght@800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #EFEFEC;
      --paper: #FBF9F4;
      --ink: #141414;
      --gray: #6E6C66;
      --line: #DEDAD0;
      --accent: #FF2E88;
      --yellow: #FFE79E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: var(--page-bg); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; position: relative; overflow: hidden;
    }
    .bg-blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .35; z-index: 0; pointer-events: none; }
    .bg-blob.b1 { width: 360px; height: 360px; background: #B7F1DC; top: -100px; left: -120px; }
    .bg-blob.b2 { width: 320px; height: 320px; background: #FFD0E4; bottom: -120px; right: -100px; }

    .card {
      position: relative; z-index: 1;
      width: min(92vw, 420px);
      background: var(--paper); border-radius: 3px 14px 3px 3px;
      box-shadow: 0 2px 4px rgba(20,20,20,.05), 0 18px 40px rgba(20,20,20,.14), 0 4px 10px rgba(20,20,20,.06);
      padding: clamp(32px, 6vw, 52px) clamp(24px, 5vw, 40px);
      text-align: center;
      opacity: 0; transform: translateY(16px) scale(.98);
      transition: opacity .6s cubic-bezier(.2,.7,.3,1), transform .6s cubic-bezier(.2,.7,.3,1);
    }
    .card.in { opacity: 1; transform: none; }

    .paperclip-wrap { position: absolute; top: -11px; right: 32px; width: 28px; height: 58px; }
    .paperclip { width: 100%; height: 100%; display: block; transform: rotate(-8deg); transform-origin: 55% 35%; filter: drop-shadow(1px 5px 5px rgba(20,20,20,.25)); animation: clipFloat 5s ease-in-out infinite; }
    @keyframes clipFloat { 50% { transform: rotate(-8deg) translateY(-3px); } }

    .code {
      font-family: 'Sofia Sans Extra Condensed', sans-serif;
      font-weight: 800; font-size: clamp(80px, 20vw, 130px);
      line-height: .9; letter-spacing: .01em; color: var(--ink);
    }
    .code span { color: var(--ink); }
    h1 { font-size: 19px; font-weight: 700; margin: 10px 0 10px; }
    p { color: var(--gray); font-size: 14.5px; line-height: 1.5; max-width: 30em; margin: 0 auto 28px; }

    .note-cta {
      position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      width: 128px; aspect-ratio: 1/1;
      background: var(--yellow); padding: 14px; border-radius: 2px;
      text-decoration: none; color: var(--ink); transform: rotate(-3deg);
      box-shadow: 0 10px 22px rgba(20,20,20,.16);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .note-cta:hover { transform: rotate(0deg) translateY(-3px); box-shadow: 0 16px 30px rgba(20,20,20,.2); }
    .note-tape {
      position: absolute; top: -11px; left: 50%; margin-left: -30px; width: 60px; height: 22px;
      background: rgba(255,150,150,.6); transform: rotate(-4deg);
    }
    .note-text { font-family: 'Caveat', cursive; font-weight: 700; font-size: 22px; line-height: 1.05; }

    @media (prefers-reduced-motion: reduce) {
      .card, .paperclip { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg-blob b1" aria-hidden="true"></div>
  <div class="bg-blob b2" aria-hidden="true"></div>

  <div class="card" id="card">
    <div class="paperclip-wrap">
      <svg class="paperclip" viewBox="0 0 40 86" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="clipMetal" x1="0" y1="0" x2="1" y2="0.2">
            <stop offset="0%" stop-color="#AFB2B7"/>
            <stop offset="18%" stop-color="#F7F8F9"/>
            <stop offset="38%" stop-color="#8E9196"/>
            <stop offset="58%" stop-color="#E4E5E7"/>
            <stop offset="80%" stop-color="#75787D"/>
            <stop offset="100%" stop-color="#C4C6C9"/>
          </linearGradient>
        </defs>
        <path d="M14 20V60a5 5 0 0 0 10 0V14a8 8 0 0 0 -16 0V66a12 12 0 0 0 24 0V18" stroke="url(#clipMetal)" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="code">4<span>0</span>4</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, в адресе опечатка — или страница уехала наводить порядок где-то ещё.</p>

    <a class="note-cta" href="/">
      <span class="note-tape" aria-hidden="true"></span>
      <span class="note-text">На главную</span>
    </a>
  </div>

  <script>
    requestAnimationFrame(() => document.getElementById('card').classList.add('in'));
  </script>
</body>
</html>
